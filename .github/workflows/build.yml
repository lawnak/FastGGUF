name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (portable AVX2)
        run: make portable
      - name: Self-test
        run: ./fastgguf selftest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Server smoke test (tiny synthetic model)
        run: |
          pip install gguf numpy
          python tools/synth_gguf.py tiny-test q8_0 tiny.gguf
          ./fastgguf inspect tiny.gguf
          ./fastgguf serve tiny.gguf 8080 512 > server.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:8080/v1/models && break; sleep 1; done
          curl -sf http://localhost:8080/ | grep -q fastgguf
          curl -sf http://localhost:8080/v1/chat/completions -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"hi"}],"max_tokens":8}' | tee reply.json
          grep -q '"choices"' reply.json
      - name: Batched prompt gives the same reply as token-by-token
        run: |
          P=$(python3 -c "print('The quick brown fox jumps over the lazy dog. ' * 8)")
          for q in q8_0 q4_k_m; do
            python tools/synth_gguf.py tiny-test $q t.gguf
            a=$(printf '%s\n' "$P" | ./fastgguf chat t.gguf 1024 --temp 0 --max-tokens 24 | grep -a '^llama>')
            b=$(printf '%s\n' "$P" | FASTGGUF_BATCH=0 ./fastgguf chat t.gguf 1024 --temp 0 --max-tokens 24 | grep -a '^llama>')
            echo "$q: $a"
            [ -n "$a" ] && [ "$a" = "$b" ]
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fastgguf-linux-x86_64
          path: |
            fastgguf
            fastgguf-server
            fastgguf-console

  # Windows .exe: cross-compiled with mingw-w64 (static, OpenMP included, no DLLs needed)
  windows-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        timeout-minutes: 10
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64
      - name: Build (portable AVX2, static)
        run: make portable OS=Windows_NT CC=x86_64-w64-mingw32-gcc
      - uses: actions/upload-artifact@v4
        with:
          name: fastgguf-windows-x86_64
          path: |
            fastgguf.exe
            fastgguf-server.exe
            fastgguf-console.exe
            chat.bat
            server.bat

  # ...and tested on real Windows
  windows-test:
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fastgguf-windows-x86_64
      - name: Self-test
        run: .\fastgguf.exe selftest
      - name: GPU probe (no GPU on CI, must not crash)
        run: .\fastgguf.exe gpu; exit 0

  # building with MSYS2 the way a user would
  windows-msys2:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-toolchain
      - name: Build
        run: make portable
      - name: Self-test
        run: PATH=/ucrt64/bin:$PATH ./fastgguf.exe selftest

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # Apple clang has no OpenMP and Apple Silicon has no AVX2: single-thread scalar path
      - name: Build
        run: make fastgguf CC=clang CFLAGS="-O3 -Wall" LDLIBS="-lm"
      - name: Self-test
        run: ./fastgguf selftest

name: release

# Push a tag like v0.1.0 to build, test and publish a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Windows: built on Windows with MSYS2 (its gcc has a static OpenMP library, so each .exe is
  # self-contained), checked for DLL dependencies and self-tested on the same machine
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make zip mingw-w64-ucrt-x86_64-toolchain
      - name: Build (AVX-512 VNNI / AVX-VNNI / AVX2 / x86-64 in each .exe)
        run: |
          set -e
          make portable
          mkdir -p dist/win && mv *.exe dist/win/
      - name: No DLLs besides Windows' own, and self-test without MSYS2 on PATH
        run: |
          set -e
          for e in dist/win/*.exe; do
            if ldd "$e" | grep -iE '/ucrt64/|/mingw64/|/usr/bin/'; then echo "$e needs MSYS2 DLLs"; exit 1; fi
          done
          for v in avx512 avxvnni avx2 sse2; do
            PATH=/c/Windows/System32:/c/Windows FASTGGUF_CPU=$v ./dist/win/fastgguf.exe selftest > st.log 2>&1 || { cat st.log; exit 1; }
            if grep -q "cannot run" st.log; then echo "$v: not supported by this runner"; else echo "$v: $(tail -1 st.log)"; fi
          done
      - name: Package
        run: |
          sed "s#REPO#${{ github.repository }}#" tools/release-readme.txt > README.txt
          cp chat.bat server.bat README.txt dist/win/
          (cd dist/win && zip -q -9 ../fastgguf-$TAG-windows-x64.zip *)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (AVX-512 VNNI / AVX-VNNI / AVX2 / x86-64 in each binary) and self-test
        run: |
          set -e
          make portable
          for v in avx512 avxvnni avx2 sse2; do
            FASTGGUF_CPU=$v ./fastgguf selftest > st.log 2>&1 || { cat st.log; exit 1; }
            if grep -q "cannot run" st.log; then echo "$v: not supported by this runner"; else echo "$v: $(tail -1 st.log)"; fi
          done
      - name: Package
        run: |
          mkdir -p dist/linux
          sed "s#REPO#${{ github.repository }}#" tools/release-readme.txt > dist/linux/README.txt
          cp fastgguf fastgguf-server fastgguf-console run.sh dist/linux/
          tar -C dist/linux -czf dist/fastgguf-$TAG-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*.tar.gz

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Downloads

          | File | For |
          |---|---|
          | \`fastgguf-$TAG-windows-x64.zip\` | **Windows 10/11**, any 64-bit Intel / AMD CPU |
          | \`fastgguf-$TAG-linux-x64.tar.gz\` | Linux x86-64 |

          Each program carries four builds of the engine (AVX-512 VNNI, AVX-VNNI, AVX2 and plain x86-64)
          and starts the fastest one your CPU supports; the start-up line shows which.

          **Windows quick start:** unzip, then drag a \`.gguf\` model onto \`chat.bat\` (terminal chat)
          or \`server.bat\` (web chat at http://localhost:8080). No installation needed — static \`.exe\`,
          GPU (NVIDIA / AMD / Intel) used automatically through the graphics driver.

          All binaries passed \`fastgguf selftest\` for every build the CI machines can run (Windows builds
          were built and tested on Windows).
          See the [README](https://github.com/${{ github.repository }}#readme) for supported models and settings.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "fastgguf $TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi

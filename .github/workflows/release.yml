name: release

# Push a tag like v0.1.0 to build, test and publish a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Windows: built on Windows with MSYS2 (its gcc has a static OpenMP library, so each .exe is
  # self-contained), checked for DLL dependencies and self-tested on the same machine
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make zip mingw-w64-ucrt-x86_64-toolchain
      - name: Build (AVX2 + compat)
        run: |
          set -e
          make portable
          mkdir -p dist/win && mv *.exe dist/win/
          make -B ARCH="-march=x86-64"
          mkdir -p dist/win-compat && mv *.exe dist/win-compat/
      - name: No DLLs besides Windows' own, and self-test without MSYS2 on PATH
        run: |
          set -e
          for d in win win-compat; do
            for e in dist/$d/*.exe; do
              if ldd "$e" | grep -iE '/ucrt64/|/mingw64/|/usr/bin/'; then echo "$e needs MSYS2 DLLs"; exit 1; fi
            done
            PATH=/c/Windows/System32:/c/Windows ./dist/$d/fastgguf.exe selftest
          done
      - name: Package
        run: |
          sed "s#REPO#${{ github.repository }}#" tools/release-readme.txt > README.txt
          for d in win win-compat; do cp chat.bat server.bat README.txt dist/$d/; done
          (cd dist/win && zip -q -9 ../fastgguf-$TAG-windows-x64.zip *)
          (cd dist/win-compat && zip -q -9 ../fastgguf-$TAG-windows-x64-compat.zip *)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (AVX2) and self-test
        run: |
          make portable
          ./fastgguf selftest
      - name: Package
        run: |
          mkdir -p dist/linux
          sed "s#REPO#${{ github.repository }}#" tools/release-readme.txt > dist/linux/README.txt
          cp fastgguf fastgguf-server fastgguf-console run.sh dist/linux/
          tar -C dist/linux -czf dist/fastgguf-$TAG-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*.tar.gz

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Downloads

          | File | For |
          |---|---|
          | \`fastgguf-$TAG-windows-x64.zip\` | **Windows 10/11, most PCs** (Intel 2013+ / AMD Ryzen, AVX2) |
          | \`fastgguf-$TAG-windows-x64-compat.zip\` | Windows on old CPUs without AVX2 (slower) |
          | \`fastgguf-$TAG-linux-x64.tar.gz\` | Linux x86-64 with AVX2 |

          **Windows quick start:** unzip, then drag a \`.gguf\` model onto \`chat.bat\` (terminal chat)
          or \`server.bat\` (web chat at http://localhost:8080). No installation needed — static \`.exe\`,
          GPU (NVIDIA / AMD / Intel) used automatically through the graphics driver.

          All binaries passed \`fastgguf selftest\` (Windows builds were built and tested on Windows).
          See the [README](https://github.com/${{ github.repository }}#readme) for supported models and settings.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "fastgguf $TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi
